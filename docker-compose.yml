services:
  backend:
    build:
      context: ./backend
    image: recruitai-backend:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      SIGNED_URL_BASE: ${SIGNED_URL_BASE}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-mock}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-mock-model}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      LOCAL_STORAGE_PATH: /app/uploads
      # Railway-specific
      RAILWAY_STATIC_URL: ${RAILWAY_STATIC_URL}
      RAILWAY_PROJECT_ID: ${RAILWAY_PROJECT_ID}
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: recruitai-frontend:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Used by Next.js server components for SSR fetches inside the docker network.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      # Railway-specific
      RAILWAY_STATIC_URL: ${RAILWAY_STATIC_URL}
      RAILWAY_PROJECT_ID: ${RAILWAY_PROJECT_ID}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_uploads:
